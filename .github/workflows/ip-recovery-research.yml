name: NetBox Operator - correctness research

on:
  push:
    branches:
      - research/ip-claim-recovery
      - research/vlan-foreign-ownership-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: NetBox API unit tests
        run: go test ./pkg/netbox/api -count=1
      - name: Research hash ambiguity - expect baseline Red
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchIpAddressRestorationKeyUniqueAcrossNamespaces$' -count=1 -v > collision.log 2>&1
          rc=$?
          set -e
          grep 'RESTORATION_KEY_COLLISION' collision.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red but test passed'
            exit 1
          fi
      - name: VLAN ownership regression - both directions
        run: go test ./internal/controller -run '^TestResearch(ForeignVlanSurvivesClaimDeletion|OwnedVlanIsRemovedWithDeletingClaim)$' -count=1 -v
      - name: L2VPN and IP range foreign-resource preservation
        run: go test ./internal/controller -run '^TestResearch(Foreign(L2VPN|IpRange)SurvivesClaimDeletion|Owned(L2VPN|IpRange)RemovedWithDeletingClaim)$' -count=1 -v
      - name: Controller compile
        run: go test ./internal/controller -run '^$' -count=1
      - name: Install envtest assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          "$(go env GOPATH)/bin/setup-envtest" use 1.33.0 --bin-dir bin -p path
      - name: Real Kubernetes API - foreign VLAN must survive
        run: go test ./internal/controller -run '^TestResearchEnvtestForeignVlanSurvivesClaimDeletion$' -count=1 -timeout=6m -v
      - name: Real Kubernetes replacement lifecycle - preserve standalone child
        run: go test ./internal/controller -run '^TestResearchRealLifecycleReplacementBeforeClaimDeletion$' -count=1 -timeout=6m -v
      - name: NetBox DELETE propagation - no foreign delete
        run: go test ./internal/controller -run '^TestResearchForeignVlanNetboxDeletePropagation$' -count=1 -timeout=6m -v
      - name: Live manager restart - preserve foreign VLAN
        run: go test ./internal/controller -run '^TestResearchManagerRestartAfterVlanReplacement$' -count=1 -timeout=4m -v
      - name: Existing relevant Claim integration suites
        run: go test ./internal/controller -run '^TestControllers$' -ginkgo.focus='IpAddressClaim Controller|VlanClaim Controller|L2VPNClaim Controller|IpRangeClaim Controller' -ginkgo.fail-fast -count=1 -timeout=15m
