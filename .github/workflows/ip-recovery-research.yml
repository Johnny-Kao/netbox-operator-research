name: Research - IP recovery baseline

on:
  push:
    branches:
      - research/ip-claim-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ip-recovery-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests - NetBox API
        run: go test ./pkg/netbox/api -count=1
      - name: Research assertion - expect Red from ambiguous restoration identity
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchIpAddressRestorationKeyUniqueAcrossNamespaces$' -count=1 -v > collision.log 2>&1
          rc=$?
          set -e
          grep 'RESTORATION_KEY_COLLISION' collision.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red, but assertion unexpectedly passed'
            exit 1
          fi
          echo 'Confirmed baseline Red: ambiguous restoration key encoding'
      - name: Research assertion - expect Red from unowned VLAN deletion
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchForeignVlanSurvivesClaimDeletion$' -count=1 -v > foreign-vlan.log 2>&1
          rc=$?
          set -e
          grep 'FOREIGN_VLAN_DELETED' foreign-vlan.log || { cat foreign-vlan.log; exit 1; }
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red, but test unexpectedly passed'
            exit 1
          fi
          echo 'Confirmed baseline Red: Claim deletion removes a foreign VLAN'
      - name: Research assertion - expect Red for foreign L2VPN and IP range
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchForeign(L2VPN|IpRange)SurvivesClaimDeletion$' -count=1 -v > ownership.log 2>&1
          rc=$?
          set -e
          grep 'FOREIGN_L2VPN_DELETED' ownership.log
          grep 'FOREIGN_IPRANGE_DELETED' ownership.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red but assertions passed'
            exit 1
          fi
      - name: Controller compilation
        run: go test ./internal/controller -run '^$' -count=1
      - name: Install Kubernetes envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          "$(go env GOPATH)/bin/setup-envtest" use 1.33.0 --bin-dir bin -p path
      - name: Real Kubernetes API - expect Red on foreign VLAN deletion
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchEnvtestForeignVlanSurvivesClaimDeletion$' -count=1 -timeout=6m -v > envtest-ownership.log 2>&1
          rc=$?
          set -e
          grep 'FOREIGN_VLAN_DELETED_REAL_API' envtest-ownership.log || { cat envtest-ownership.log; exit 1; }
          if [ "$rc" -eq 0 ]; then
            echo 'Expected real-API baseline Red, got Green'
            exit 1
          fi
      - name: Real Kubernetes replacement lifecycle - expected baseline Red
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchRealLifecycleReplacementBeforeClaimDeletion$' -count=1 -timeout=6m -v > replacement.log 2>&1
          rc=$?
          set -e
          grep 'REAL_LIFECYCLE_FOREIGN_VLAN_DELETED' replacement.log || { cat replacement.log; exit 1; }
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red but test passed'
            exit 1
          fi
      - name: NetBox DELETE propagation - expect original Red
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchForeignVlanNetboxDeletePropagation$' -count=1 -timeout=6m -v > netbox-delete.log 2>&1
          rc=$?
          set -e
          grep 'NETBOX_FOREIGN_VLAN_DELETE_CALLED' netbox-delete.log || { cat netbox-delete.log; exit 1; }
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red but test passed'
            exit 1
          fi
      - name: Live manager restart - expected baseline Red
        shell: bash
        run: |
          set +e
          go test ./internal/controller -run '^TestResearchManagerRestartAfterVlanReplacement$' -count=1 -timeout=4m -v > manager-restart.log 2>&1
          rc=$?
          set -e
          grep 'MANAGER_RESTART_FOREIGN_VLAN_DELETED' manager-restart.log || { cat manager-restart.log; exit 1; }
          if [ "$rc" -eq 0 ]; then
            echo 'Expected baseline Red, got Green'
            exit 1
          fi
      - name: Existing IP Address Claim integration suite
        run: go test ./internal/controller -run '^TestControllers$' -ginkgo.focus='IpAddressClaim Controller' -ginkgo.fail-fast -count=1 -timeout=15m
